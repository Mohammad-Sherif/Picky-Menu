<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Picky | Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background: #f4e1d6;
            margin: 0;
            padding: 20px;
            color: #1a1a1a;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            text-align: center;
            color: #4a2c1f;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-family: 'Quicksand', sans-serif;
            box-sizing: border-box;
        }
        button {
            background: #e22400;
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-family: 'Quicksand', sans-serif;
        }
        button:hover {
            background: #c11f00;
        }
        #dashboard {
            display: none;
        }
        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        .item-name {
            flex: 1;
            font-weight: 600;
        }
        .item-price {
            width: 120px;
        }
        #status {
            text-align: center;
            margin-top: 15px;
            font-weight: 600;
        }
        .error { color: red; }
        .success { color: green; }
        
        /* Loading spinner */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #e22400;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Picky Admin</h1>

    <div id="login-section">
        <p style="text-align:center; color:#666; margin-bottom: 20px;">Enter your GitHub details to manage prices.</p>
        <div class="form-group">
            <label>GitHub Token (Secret Key)</label>
            <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
        </div>
        <div class="form-group">
            <label>Repository Owner (Username)</label>
            <input type="text" id="gh-owner" placeholder="e.g. mohammad-xyz">
        </div>
        <div class="form-group">
            <label>Repository Name</label>
            <input type="text" id="gh-repo" placeholder="e.g. picky-menu">
        </div>
        <button id="login-btn">Login & Load Menu</button>
        <div class="loader" id="login-loader"></div>
        <div id="login-status" id="status"></div>
    </div>

    <div id="dashboard">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
            <h2>Update Prices</h2>
            <button id="logout-btn" style="width: auto; background: #666;">Logout</button>
        </div>
        <div id="items-container"></div>
        <button id="save-btn" style="margin-top: 20px;">Save & Publish Changes</button>
        <div class="loader" id="save-loader"></div>
        <div id="save-status" id="status"></div>
    </div>
</div>

<script>
    let fileSha = '';
    let menuDataObj = null;

    document.getElementById('login-btn').addEventListener('click', async () => {
        const token = document.getElementById('gh-token').value.trim();
        const owner = document.getElementById('gh-owner').value.trim();
        const repo = document.getElementById('gh-repo').value.trim();
        
        if (!token || !owner || !repo) {
            alert('Please fill all fields');
            return;
        }

        document.getElementById('login-loader').style.display = 'block';
        document.getElementById('login-status').textContent = '';

        try {
            // Fetch data.js from Github API
            const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/data.js`, {
                headers: {
                    'Authorization': `token ${token}`,
                    'Accept': 'application/vnd.github.v3+json'
                }
            });

            if (!response.ok) {
                throw new Error('Failed to connect. Check your token and repo details.');
            }

            const data = await response.json();
            fileSha = data.sha; // Needed for updating
            
            // Decode base64 content
            const content = decodeURIComponent(escape(atob(data.content)));
            
            // Extract JSON
            let jsonStr = content.replace('const menuData = ', '').trim();
            if (jsonStr.endsWith(';')) jsonStr = jsonStr.slice(0, -1);
            
            menuDataObj = JSON.parse(jsonStr);
            
            renderDashboard();
            
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
        } catch (error) {
            document.getElementById('login-status').textContent = error.message;
            document.getElementById('login-status').className = 'error';
        } finally {
            document.getElementById('login-loader').style.display = 'none';
        }
    });

    function renderDashboard() {
        const container = document.getElementById('items-container');
        container.innerHTML = '';

        menuDataObj.items.forEach((item, index) => {
            const row = document.createElement('div');
            row.className = 'item-row';
            
            row.innerHTML = `
                <div class="item-name">${item.name} <br><small style="color:#777;">${item.name_ar}</small></div>
                <div class="item-price">
                    <input type="text" id="price-${index}" value="${item.price.replace(' EGP', '')}">
                </div>
            `;
            container.appendChild(row);
        });
    }

    document.getElementById('save-btn').addEventListener('click', async () => {
        const token = document.getElementById('gh-token').value.trim();
        const owner = document.getElementById('gh-owner').value.trim();
        const repo = document.getElementById('gh-repo').value.trim();

        document.getElementById('save-loader').style.display = 'block';
        document.getElementById('save-status').textContent = '';

        // Update object with new prices
        menuDataObj.items.forEach((item, index) => {
            const newPrice = document.getElementById(`price-${index}`).value.trim();
            item.price = `${newPrice} EGP`;
        });

        // Convert back to string
        const newContent = `const menuData = ${JSON.stringify(menuDataObj, null, 4)};`;
        // Encode to base64 safely supporting utf-8
        const encodedContent = btoa(unescape(encodeURIComponent(newContent)));

        try {
            const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/data.js`, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${token}`,
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: 'Update prices via Picky Admin Dashboard',
                    content: encodedContent,
                    sha: fileSha
                })
            });

            if (!response.ok) {
                throw new Error('Failed to save. Make sure the token has write (repo) permissions.');
            }

            const data = await response.json();
            fileSha = data.content.sha; // Update SHA for subsequent saves

            document.getElementById('save-status').textContent = 'Prices updated successfully! The live menu will reflect changes shortly.';
            document.getElementById('save-status').className = 'success';
        } catch (error) {
            document.getElementById('save-status').textContent = error.message;
            document.getElementById('save-status').className = 'error';
        } finally {
            document.getElementById('save-loader').style.display = 'none';
        }
    });

    document.getElementById('logout-btn').addEventListener('click', () => {
        document.getElementById('gh-token').value = '';
        document.getElementById('login-section').style.display = 'block';
        document.getElementById('dashboard').style.display = 'none';
        document.getElementById('save-status').textContent = '';
        menuDataObj = null;
    });
</script>

</body>
</html>
