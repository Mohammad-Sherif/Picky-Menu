<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Picky | Menu</title>
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <h1 class="brand-name">Picky</h1>
            <div class="header-actions">
                <button class="icon-btn"><i class="fas fa-bell"></i> Ring</button>
            </div>
        </div>
        <div class="restaurant-info">
            <div class="info-item">
                <i class="fas fa-utensils text-orange"></i>
                <span>Cafe</span>
            </div>
            <div class="info-item">
                <i class="fas fa-map-marker-alt text-orange"></i>
                <span>Cairo</span>
            </div>
        </div>
    </header>

    <!-- Categories (Sticky) -->
    <div class="food-category-wrapper">
        <div class="food-category" id="category-nav">
            <!-- Rendered via JS -->
        </div>
    </div>

    <!-- Menu Items -->
    <main class="menu-container" id="menu-container">
        <!-- Rendered via JS -->
    </main>

    <!-- Data and Script -->
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
