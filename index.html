<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google" content="notranslate">
    <title>Picky | Menu</title>
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <button class="lang-btn">عربي</button>
            <div class="brand-logo-container">
                <img src="https://plattir-replica.s3.us-east-1.amazonaws.com/restaurantmenu/17808253475CM (1)_page-0001.jpg" alt="Picky Logo" class="brand-logo">
            </div>
        </div>
    </header>

    <!-- Categories (Sticky) -->
    <div class="food-category-wrapper">
        <div class="food-category" id="category-nav">
            <!-- Rendered via JS -->
        </div>
    </div>

    <!-- Menu Items -->
    <main class="menu-container" id="menu-container">
        <!-- Rendered via JS -->
    </main>

    <!-- Data and Script -->
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
